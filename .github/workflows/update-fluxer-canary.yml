name: Update Fluxer Canary

on:
  schedule:
    # Run every hour: canary builds ship several times a day
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: update-fluxer-canary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0             # otherwise, you will fail to push refs to dest repo

      - name: Get latest Fluxer Canary release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          CURRENT_VERSION=$(grep -E '^[[:space:]]*version "' Casks/fluxer-canary.rb | sed -E 's/.*version "([^"]+)".*/\1/')

          # Fluxer publishes one release per package (fluxer-desktop-canary@<version>,
          # fluxer-gateway@<version>, ...), and canary releases are marked as prereleases,
          # so neither /releases/latest nor the default github_releases filter can be used.
          LATEST_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fluxerapp/fluxer/releases?per_page=100" \
            | jq -r '[.[] | select((.draft | not) and (.tag_name | startswith("fluxer-desktop-canary@")))]
                     | sort_by(.created_at) | last | .tag_name // empty' \
            | sed -e 's|^fluxer-desktop-canary@||')

          if [ -z "$LATEST_VERSION" ]; then
            echo "::error::Could not determine the latest Fluxer Canary version"
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version: $LATEST_VERSION"

      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.release.outputs.latest_version }}" != "${{ steps.release.outputs.current_version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.release.outputs.current_version }} -> ${{ steps.release.outputs.latest_version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Get DMG checksum from the release manifest
        if: steps.check.outputs.update_needed == 'true'
        id: sha256
        env:
          LATEST_VERSION: ${{ steps.release.outputs.latest_version }}
        run: |
          set -o pipefail

          # The manifest is uploaded by the same CI run that uploads the DMG, so its
          # sha256 always matches the asset (and saves a 240 MB download).
          ASSET="Fluxer-Canary-${LATEST_VERSION}-mac-universal.dmg"
          MANIFEST_URL="https://github.com/fluxerapp/fluxer/releases/download/fluxer-desktop-canary%40${LATEST_VERSION}/Fluxer-Canary-${LATEST_VERSION}-release-manifest.json"
          SHA256=$(curl -fsSL "$MANIFEST_URL" \
            | jq -r --arg asset "$ASSET" '[.assets[] | select(.release_asset == $asset)][0].sha256 // empty')

          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Could not determine the sha256 of $ASSET"
            exit 1
          fi

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - uses: Homebrew/actions/setup-homebrew@main
        if: steps.check.outputs.update_needed == 'true'
        with:
          core: true

      - name: Update cask file
        if: steps.check.outputs.update_needed == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.latest_version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          # The url is interpolated from #{version}, so only the version and sha256 change.
          # perl -pi is portable (BSD sed needs -i '', GNU sed does not accept it)
          # single quotes: the shell must not expand $ENV{...}, perl expands it from the environment
          perl -pi -e 's/version "[^"]*"/version "$ENV{LATEST_VERSION}"/' Casks/fluxer-canary.rb
          perl -pi -e 's/sha256 "[^"]*"/sha256 "$ENV{SHA256}"/' Casks/fluxer-canary.rb

          git --no-pager diff -- Casks/fluxer-canary.rb

      - name: Test the updated cask
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # setup-homebrew symlinks the tap directory to this checkout
          # (/opt/homebrew/Library/Taps/<owner>/homebrew-tap -> the workspace), so the cask
          # is usually already in place. cp exits 1 with "are identical (not copied)" when
          # source and destination are the same file, which `bash -e` treats as a failure,
          # so only copy when the files actually differ.
          brew tap ${{ github.repository }}
          TAP_PATH=$(brew --repository rafifos/tap)
          cmp -s Casks/fluxer-canary.rb "$TAP_PATH/Casks/fluxer-canary.rb" ||
            cp Casks/fluxer-canary.rb "$TAP_PATH/Casks/fluxer-canary.rb"

          brew style --cask "$TAP_PATH/Casks/fluxer-canary.rb"
          brew fetch --retry --cask rafifos/tap/fluxer-canary # downloads and verifies the sha256
          brew install --dry-run --cask rafifos/tap/fluxer-canary

      - name: Commit and push changes
        if: steps.check.outputs.update_needed == 'true'
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: update Fluxer Canary to ${{ steps.release.outputs.latest_version }}"
